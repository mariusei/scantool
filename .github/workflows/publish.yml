name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: astral-sh publishes no floating v10 tag (their last
        # floating major is v7, while releases are at v10.x). Dependabot bumps it.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.13'

      # A version bump that skips `uv lock` leaves the lockfile stale, which
      # only surfaced as a test-run failure after the release was already cut.
      - name: Install dependencies (fails on a stale lockfile)
        run: uv sync --locked --group dev

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "Tag and version agree on $version"

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest tests/ -q

  publish:
    name: Build and publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scantool
    permissions:
      id-token: write  # Required for trusted publishing
      attestations: write  # Required for package attestations

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: astral-sh publishes no floating v10 tag (their last
        # floating major is v7, while releases are at v10.x). Dependabot bumps it.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # This uses PyPI Trusted Publishers - no token needed!
        # Just configure on PyPI: https://pypi.org/manage/account/publishing/
