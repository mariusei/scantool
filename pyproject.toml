[project]
name = "scantool"
version = "0.30.0"
description = "Code structure for coding agents: classes, functions, callers and headings with line numbers, as an MCP server and the sct shell command. 20+ languages, tree-sitter, no index."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marius Berge Eide" }
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol",
    "code-analysis", "tree-sitter", "claude", "claude-code",
    "code-structure-mcp", "structure-extraction", "static-analysis",
    "coding-agent", "cursor", "call-graph", "structural-diff", "sct",
    "ast", "code-structure", "codebase-analysis", "ai-tools",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.0.2",
    "tree-sitter>=0.23.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-rust>=0.23.2",
    "tree-sitter-go>=0.23.3",
    "tree-sitter-markdown>=0.3.2",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-java>=0.23.2",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-php>=0.23.4",
    "pillow>=10.0.0",
    "uvicorn>=0.32.1",
    "tree-sitter-sql>=0.3.11",
    "pglast>=7.7",
    "tree-sitter-zig>=1.1.2",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.23.0",
    "tree-sitter-swift>=0.0.1",
    "numpy>=1.24.0",
    "tree-sitter-language-pack>=1.15.8",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8",
]

[project.scripts]
scantool = "scantool:main"
scantool-http = "scantool.server:http_main"
sct = "scantool.cli:main"

[project.urls]
Homepage = "https://github.com/mariusei/scantool"
Repository = "https://github.com/mariusei/scantool"
Issues = "https://github.com/mariusei/scantool/issues"
Changelog = "https://github.com/mariusei/scantool/releases"
"MCP Registry" = "https://glama.ai/mcp/servers/@mariusei/scantool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    # Deliberately malformed fixtures: they exercise the regex fallback for
    # files tree-sitter cannot parse, so their syntax errors are the point.
    "tests/*/samples",
    # Frozen harness for preregistered benchmarks. Reformatting it would
    # invalidate the reproducibility of results already recorded against it.
    "experiments",
    # Frozen golden data, input and snapshots alike: the scanner's output is
    # asserted against it byte-for-byte, so its exact text IS the test. Ruff
    # sorted the imports in consensus_fixture/ once before this line existed —
    # harmless, but F401 on a planted unused import would have deleted the
    # very pattern the fixture exists to plant.
    "tests/golden",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is formatter's job
    "SIM108",  # ternary is not always more readable than if/else
    "B905",    # zip(strict=) adds noise where lengths are structurally equal
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal booleans and bind values for readability.
"tests/**" = ["E712", "F841"]

[tool.mypy]
python_version = "3.11"
files = ["src/scantool"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Bodies of unannotated functions are skipped by default. The codebase is
# clean with them checked, so the gate covers them rather than growing a
# blind spot in every function that lacks a signature.
check_untyped_defs = true
