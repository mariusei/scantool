# Public corpora for scripts/language_depth.py, one per language handler.
#
# Each entry is pinned to a commit so a measurement is reproducible and a
# change in the numbers comes from scantool, not from the corpus. `path` is
# the directory that is analysed; `extensions` are the files counted as the
# language's own (other files in the tree still take part in the analysis).
#
# Choose a real, maintained project with a permissive licence and a few
# dozen to a few hundred source files. The corpus is cloned at measurement
# time into a cache outside the repository; nothing from it is committed.

[[corpus]]
language = "python"
repo = "pallets/click"
commit = "2247b35ea1c47c727d7a06e51fa280e12a863ff6"
path = "src/click"
extensions = [".py"]

